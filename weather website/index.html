<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wheather API</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search"
    />
    <link rel="stylesheet" href="stylesheet.css"/>
    <link rel="icon" href="https://imgs.search.brave.com/cUbkMS_-pSQ2Nlene2Sh9_o_Tr4m70i1kZaQkJ2pOBQ/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pbWFn/ZS5wbmdhYWEuY29t/LzM4NS80MDg5Mzg1/LW1pZGRsZS5wbmc"/>
    
  </head>
  <body>
    <header>
      <img
        id="logo"
        src="https://imgs.search.brave.com/rVNp5cpNlzi0ANPUULRPvYf48oq2ZXpv0dHipk4mnJM/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pbWcu/bWFnbmlmaWMuY29t/L3ByZW1pdW0tdmVj/dG9yL3doaXRlLWRv/dHRlZC0zZC1lYXJ0/aC13b3JsZC1tYXAt/Z2xvYmUtYmxhY2st/YmFja2dyb3VuZC12/ZWN0b3ItaWxsdXN0/cmF0aW9uXzE3NTgz/OC0xNzY0LmpwZz9n/YT1HQTEuMS4xNTM0/ODIwNTU2LjE3OTA2/NDIwOTgmc2VtdD1h/aXNfaHlicmlkJnc9/NzQwJnE9ODA"
        height="80px"
      />
      <span id="title">Weather</span>

      <input
        type="text"
        id="searchbar"
        required
        placeholder="Enter City Name"
      />
      <button type="submit" id="submit"
        style="background-color: transparent; border: none; margin-right: 10px;
        padding:4px"
      >
        <span
          style="font-size: 32px;"
          id="searchicon"
          class="material-symbols-outlined"
          >search</span
        >
      </button>
     
    </header>
    <div id="container">
      <div id="report">
        <p id="city_name">OKLAHOMA</p>
        <h3 id="country">US</h3>
        <br><br>
        <p id="temp"><span style="font-weight: 700;">Temperature:</span> 18.01 celsius</p>
        <p id="humidity"><span style="font-weight: 700;">Humidity:</span> 94%</p>
        <p id="msg">clear Sky</p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
